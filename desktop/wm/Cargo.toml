[package]
name = "tiaki-wm"
version = "0.1.0"
edition = "2024"
description = "Tiaki's window manager: ShojiWM with Tiaki's frame, palette and keybinds."

# A config crate is its own workspace: it is built outside the Tiaki workspace
# and depends on ShojiWM by pinned revision.
[workspace]

[dependencies]
shojiwm_rs = { git = "https://github.com/bea4dev/ShojiWM", rev = "1259ac0b9a23f485845e8f820129b4612d6befaa" }
serde_json = "1.0.140"
tracing = "0.1.41"

[dev-dependencies]
# The config's tests drive the compositor's runtime directly, the same calls
# `shojiwm_lib` makes.
shojiwm_lib = { git = "https://github.com/bea4dev/ShojiWM", rev = "1259ac0b9a23f485845e8f820129b4612d6befaa" }

[profile.release]
lto = true
codegen-units = 1
strip = true
