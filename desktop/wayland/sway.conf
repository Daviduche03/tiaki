set $mod Mod4

output HEADLESS-1 resolution 1440x900

gaps inner 34
gaps outer 16
# Bar is a 36px exclusive zone; this is air under it.
gaps top 12
gaps bottom 104
smart_gaps off
# Floating windows keep a thin border: Sway uses it as the grab area for
# mouse resizing, so windows can be resized freely from any edge.
default_border pixel 1
default_floating_border pixel 4
font pango:IBM Plex Sans 10

# Sway is the fallback for machines without DRM; tiaki-wm draws its own
# 10px rounded hairline on hardware. Colours match that frame as closely as
# Sway allows: 1px paper hairlines, no blue, no red. Sway cannot round
# corners, so square here is a fallback limit, not the design.
client.focused          #8A8578 #151413 #E6E0D4 #8A8578
client.focused_inactive #3A3733 #151413 #8A8578 #3A3733
client.unfocused        #3A3733 #151413 #665F54 #3A3733
client.urgent           #D08A2C #151413 #E6E0D4 #D08A2C

# Tiaki is a floating desktop: windows open where they want and you drag
# them where you want them, macOS-style. Tiling is opt-in per session
# (Super+S in tiaki-wm; Super+B/V/S/W/E in this Sway fallback), never the
# default. So every window floats unless a rule below says otherwise.
for_window [all] floating enable

# btop opens as a wide floating monitor window, not a narrow tile.
for_window [app_id="btop"] floating enable, resize set 940 560, move position center

# The agent app is a floating panel like Settings, not a tile.
for_window [title="Agents"] floating enable, resize set 1000 680, move position center

# Settings is an app window that floats at a fixed size, like Windows 11.
for_window [title="Settings"] floating enable, resize set 1180 780, move position center

# Every app starts inside its scheduling class. `sched-launch` puts it in a
# cgroup, weighs it against the others, and cleans up on exit. Shell surfaces
# are foreground so the UI stays responsive; background helpers are throttled
# first; agent sessions are launched with --class agent.
# Startup is owned by tiaki-session (tiaki-session.service): it starts the
# wallpaper, wayvnc and the sign-in screen inside whichever compositor runs.
# Sway is the fallback for machines with no DRM device; tiaki-wm is not
# launched from here.

bindsym $mod+Return exec sched-launch --class foreground -- foot -c /etc/tiaki/foot.ini
bindsym $mod+space exec tiaki-shell launcher
bindsym $mod+d exec tiaki-shell launcher
# macOS window management: app switcher and window cycling.
bindsym $mod+Tab exec tiaki-shell switcher
bindsym $mod+grave exec tiaki-shell switcher focused
# Zoom lives on the titlebar double-click and Window → Zoom (no key; ⌘↑
# stays focus-up like macOS Ctrl-F2 navigation).
bindsym $mod+q kill
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
# Window arrangements: tiling auto-layout plus mouse drag.
floating_modifier $mod
tiling_drag enable
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+Shift+space floating toggle
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down
bindsym $mod+r mode "resize"
mode "resize" {
  bindsym Left resize shrink width 10 px
  bindsym Right resize grow width 10 px
  bindsym Up resize shrink height 10 px
  bindsym Down resize grow height 10 px
  bindsym Escape mode "default"
  bindsym Return mode "default"
}
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+Shift+m scratchpad show
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+l exec swaylock -f
bindsym $mod+Shift+e exit
